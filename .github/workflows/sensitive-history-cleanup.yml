name: One-time sensitive history cleanup

on:
  push:
    paths:
      - .github/security-cleanup-request.json

permissions:
  contents: write

concurrency:
  group: sensitive-history-cleanup-${{ github.repository }}
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install pinned history rewrite tool
        run: python3 -m pip install --disable-pip-version-check --no-deps git-filter-repo==2.47.0
      - name: Validate and atomically publish the requested cleanup
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/rewrite-sensitive-history.py
          --config .github/security-cleanup-config.json
          --workdir "${RUNNER_TEMP}/sensitive-history-mirror.git"
          --publish
